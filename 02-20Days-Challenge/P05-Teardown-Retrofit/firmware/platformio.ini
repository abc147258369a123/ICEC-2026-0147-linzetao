; ICEC 项目五 第④项 —— 旧充电宝电池健康度（SOH）监测改造
; 主控：ESP32-C3  |  采样：INA219  |  框架：Arduino
;
; 换板子怎么改：
;   手上是 ESP32-S3 就把 board 换成 esp32-s3-devkitc-1
;   （工具链 toolchain-xtensa-esp32s3 已在本机可用）
;
; 常用命令：
;   pio run                 编译
;   pio run -t upload       下载（需要接 USB）
;   pio device monitor      看串口输出

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wall
board_build.filesystem = littlefs
